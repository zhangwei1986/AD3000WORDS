`;
const NAMES=["200高频词","500高频词","1000高频词","2000高频词","3000高频词"];
const W=NAMES.map(()=>[]);RAW.split("\n").forEach(l=>{const p=l.trim().split("|");const t=NAMES.indexOf(p[0]);if(t>=0&&p[1])W[t].push({w:p[1],c:p[2]||"",p:p[3]||""})});
const K="vocab3000_v1";
let S=JSON.parse(localStorage.getItem(K)||"null")||{learned:{},hard:[],pos:[0,0,0,0,0],tier:0};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const key=(t,i)=>t+"_"+i;
function speak(txt){if(!window.speechSynthesis){alert("当前浏览器不支持发音");return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=0.85;
const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
const $=id=>document.getElementById(id);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
document.querySelectorAll(".sec").forEach(x=>x.classList.toggle("on",x.id===b.dataset.s));
if(b.dataset.s==="prog")renderProg();if(b.dataset.s==="hard"){hi=0;renderHard()}if(b.dataset.s==="study")renderCard()});
function renderTiers(){$("tiers").innerHTML=NAMES.map((n,i)=>`<button class="${i===S.tier?"on":""}" data-i="${i}">${n}（${W[i].length}）</button>`).join("");
$("tiers").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tier=+b.dataset.i;save();renderTiers();renderCard()})}
const isHard=(t,i)=>S.hard.includes(key(t,i));
function renderCard(){if(!W[S.tier].length){$("card").innerHTML="<div class='empty'>本级别暂无数据，请检查是否已粘贴单词数据</div>";$("info").textContent="";return}
if(S.pos[S.tier]>=W[S.tier].length)S.pos[S.tier]=0;const t=S.tier,i=S.pos[t],o=W[t][i],k=key(t,i),L=!!S.learned[k],H=isHard(t,i);
$("card").innerHTML=`${L?'<span class="tag l">✔ 已学习</span>':""}${H?'<span class="tag h">★ 难词</span>':""}
<div class="word" id="wd">${o.w}</div><div class="spk">🔊 点击单词发音</div>
<div class="cn">${o.c}</div><div class="ph" id="ph">💬 ${o.p} <small>🔊</small></div>
<div class="btns"><button class="b1" id="prev">◀ 上一个</button>
<button class="b2 ${L?"done":""}" id="lb">${L?"✔ 已学习（点击取消）":"✅ 标记已学习"}</button>
<button class="b3 ${H?"done":""}" id="hb">${H?"★ 已收藏（点击取消）":"☆ 收藏难词"}</button>
<button class="b4" id="next">下一个 ▶</button></div>`;
$("wd").onclick=()=>speak(o.w);$("ph").onclick=()=>speak(o.p);
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("lb").onclick=()=>{if(L)delete S.learned[k];else{S.learned[k]=1;save();move(1);return}save();renderCard()};
$("hb").onclick=()=>{if(H)S.hard=S.hard.filter(x=>x!==k);else S.hard.push(k);save();renderCard()};
const n=W[t].filter((_,j)=>S.learned[key(t,j)]).length;
$("info").textContent=`${NAMES[t]}：第 ${i+1} / ${W[t].length} 个 ｜ 本级已学 ${n} 个 ｜ 难词库共 ${S.hard.length} 个`;
$("jn").max=W[t].length}
function move(d){const t=S.tier,N=W[t].length;let i=S.pos[t];
for(let c=0;c<N;c++){i=(i+d+N)%N;if(!$("skip").checked||!S.learned[key(t,i)])break}
S.pos[t]=i;save();renderCard()}
$("jb").onclick=()=>{const t=S.tier,v=parseInt($("jn").value);if(v>=1&&v<=W[t].length){S.pos[t]=v-1;save();renderCard()}};
$("rnd").onclick=()=>{const t=S.tier;S.pos[t]=Math.floor(Math.random()*W[t].length);save();renderCard()};
document.addEventListener("keydown",e=>{if(!$("study").classList.contains("on")||e.target.tagName==="INPUT")return;
if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();speak(W[S.tier][S.pos[S.tier]].w)}});
function renderProg(){let tot=0,all=0;let h=W.map((a,t)=>{if(!a.length)return "";const n=a.filter((_,j)=>S.learned[key(t,j)]).length;tot+=n;all+=a.length;const p=(n/a.length*100).toFixed(1);
return `<div class="prog"><div class="t"><b>${NAMES[t]}</b><span>已学 ${n} / ${a.length}（${p}%）</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
$("progBox").innerHTML=`<div class="sum">总进度：已学 <b>${tot}</b> / ${all} 个（${all?(tot/all*100).toFixed(1):0}%） ｜ 难词库：<b>${S.hard.length}</b> 个</div>${h}
<div style="text-align:center"><button class="b1" style="border:none;padding:8px 16px;border-radius:8px;cursor:pointer" id="rst">重置全部学习记录</button></div>`;
$("rst").onclick=()=>{if(confirm("确定清空所有学习记录和难词库？")){S={learned:{},hard:[],pos:[0,0,0,0,0],tier:0};save();renderProg()}}}
let hi=0;
function renderHard(){if(!S.hard.length){$("hardBox").innerHTML='<div class="empty">🎉 难词词库为空<br><br>在“单词学习”中点击“☆ 收藏难词”即可加入</div>';return}
if(hi>=S.hard.length)hi=0;const k=S.hard[hi],[t,i]=k.split("_").map(Number),o=W[t]&&W[t][i];if(!o){S.hard.splice(hi,1);save();renderHard();return}
$("hardBox").innerHTML=`<div class="info">难词学习：第 ${hi+1} / ${S.hard.length} 个</div>
<div class="card"><span class="tag h">${NAMES[t]}</span><div class="word" id="hw">${o.w}</div><div class="spk">🔊 点击单词发音</div>
<div class="cn" id="hc" style="cursor:pointer">👀 点击显示中文</div><div class="ph" id="hp">💬 ${o.p} <small>🔊</small></div>
<div class="btns"><button class="b1" id="hpv">◀ 上一个</button><button class="b2" id="hm">✅ 已掌握（移出难词库）</button><button class="b4" id="hn">下一个 ▶</button></div></div>
<div class="list">全部难词（点击跳转）：<br>${S.hard.map((x,j)=>{const[a,b]=x.split("_").map(Number);return `<span data-j="${j}">${W[a][b].w}</span>`}).join("")}</div>`;
$("hw").onclick=()=>speak(o.w);$("hp").onclick=()=>speak(o.p);$("hc").onclick=()=>$("hc").textContent=o.c;
$("hpv").onclick=()=>{hi=(hi-1+S.hard.length)%S.hard.length;renderHard()};$("hn").onclick=()=>{hi=(hi+1)%S.hard.length;renderHard()};
$("hm").onclick=()=>{S.hard.splice(hi,1);S.learned[k]=1;save();renderHard()};
document.querySelectorAll(".list span").forEach(s=>s.onclick=()=>{hi=+s.dataset.j;renderHard()})}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
renderTiers();renderCard();
</script>
